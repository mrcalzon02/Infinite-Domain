name: Abyssal Feature Catalog Integrity

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/abyssal-feature-catalog-integrity.yml'
      - '.codex/agents/abyssal-feature-validator.toml'
      - 'tools/abyssal_worldgen/**'
      - 'tools/abyssal_rebuild/generate_abyssal_environmental_sites.py'
      - 'tools/abyssal_rebuild/generate_pillow_lava_field.py'
      - 'tools/abyssal_rebuild/generate_cooled_lava_tube_system.py'
      - 'tools/abyssal_rebuild/generate_shelf_sand_wave_field.py'
      - 'tools/abyssal_rebuild/generate_nodule_field.py'
      - 'tools/abyssal_rebuild/generate_whale_falls.py'
      - 'tools/abyssal_rebuild/generate_wood_falls.py'
      - 'kubejs/data/infinite_domain/structure/abyssal/**'
      - 'kubejs/data/infinite_domain/worldgen/structure/abyssal/**'
      - 'kubejs/data/infinite_domain/worldgen/structure_set/abyssal/**'
      - 'kubejs/data/infinite_domain/worldgen/template_pool/abyssal/**'
      - 'kubejs/data/infinite_domain/tags/worldgen/biome/**'
      - 'docs/ABYSSAL_SEAFLOOR_FEATURE_REVIEW.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate feature structural metadata
        run: python tools/abyssal_worldgen/validate_abyssal_feature_catalog.py
      - name: Validate abyssal deformation bridge
        run: python tools/abyssal_worldgen/validate_abyssal_deformation.py
      - name: Regenerate deterministic environmental templates
        run: |
          rm -rf /tmp/abyssal-env
          python tools/abyssal_rebuild/generate_abyssal_environmental_sites.py /tmp/abyssal-env --verify
          for nbt in pelagos_sensor_debris karsic_pipeline_breach abyssal_cold_seep fracture_vent_field hadal_vent_complex; do
            cmp "/tmp/abyssal-env/${nbt}.nbt" "kubejs/data/infinite_domain/structure/abyssal/${nbt}.nbt"
          done
      - name: Regenerate OSF-005 pillow-lava field
        run: |
          python tools/abyssal_rebuild/generate_pillow_lava_field.py /tmp/abyssal-env --verify
          cmp "/tmp/abyssal-env/pillow_lava_field.nbt" "kubejs/data/infinite_domain/structure/abyssal/pillow_lava_field.nbt"
      - name: Regenerate OSF-006/007 lava-tube family
        run: |
          python tools/abyssal_rebuild/generate_cooled_lava_tube_system.py /tmp/abyssal-env --verify
          cmp "/tmp/abyssal-env/cooled_lava_tube_system.nbt" "kubejs/data/infinite_domain/structure/abyssal/cooled_lava_tube_system.nbt"
          cmp "/tmp/abyssal-env/cooled_lava_tube_with_skylight.nbt" "kubejs/data/infinite_domain/structure/abyssal/cooled_lava_tube_with_skylight.nbt"
      - name: Regenerate OSF-023 sand-wave field
        run: |
          python tools/abyssal_rebuild/generate_shelf_sand_wave_field.py /tmp/abyssal-env --verify
          cmp "/tmp/abyssal-env/shelf_sand_wave_field.nbt" "kubejs/data/infinite_domain/structure/abyssal/shelf_sand_wave_field.nbt"
      - name: Regenerate OSF-037 nodule field
        run: |
          python tools/abyssal_rebuild/generate_nodule_field.py /tmp/abyssal-env --verify
          cmp "/tmp/abyssal-env/nodule_field.nbt" "kubejs/data/infinite_domain/structure/abyssal/nodule_field.nbt"
      - name: Regenerate OSF-045 whale-fall family
        run: |
          python tools/abyssal_rebuild/generate_whale_falls.py /tmp/abyssal-env --verify
          for nbt in whale_fall_coherent whale_fall_dispersed whale_fall_sedimented; do
            cmp "/tmp/abyssal-env/${nbt}.nbt" "kubejs/data/infinite_domain/structure/abyssal/${nbt}.nbt"
          done
      - name: Regenerate OSF-049 wood-fall family
        run: |
          python tools/abyssal_rebuild/generate_wood_falls.py /tmp/abyssal-env --verify
          for nbt in wood_fall_rooted wood_fall_fragmented wood_fall_buried; do
            cmp "/tmp/abyssal-env/${nbt}.nbt" "kubejs/data/infinite_domain/structure/abyssal/${nbt}.nbt"
          done
