name: LAST DAYS baseline palette application

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/last-days-baseline-palette.yml
      - tools/last_days_baseline_palette.py
      - docs/last-days-mod-reference-assets.csv
  # One-shot fallback for 2026-08-25 02:15 UTC. The successful job removes this trigger.
  schedule:
    - cron: '15 2 25 8 *'

permissions:
  contents: write

concurrency:
  group: last-days-baseline-palette
  cancel-in-progress: true

jobs:
  apply-baseline-palette:
    name: Apply baseline palette to untouched imports
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Detect completed baseline
        id: gate
        shell: bash
        run: |
          if test -s docs/last-days-baseline-palette-pass.md && \
             grep -Fq 'Mode: **APPLIED**' docs/last-days-baseline-palette-pass.md; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'Baseline audit already records an applied pass; refusing duplicate conversion.'
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        if: steps.gate.outputs.needed == 'true'
        run: python -m pip install 'Pillow>=10,<12' 'numpy>=2,<3'

      - name: Apply SHA-gated LAST DAYS baseline palette
        if: steps.gate.outputs.needed == 'true'
        run: python tools/last_days_baseline_palette.py --apply

      - name: Verify generated audit files
        if: steps.gate.outputs.needed == 'true'
        run: |
          test -s docs/last-days-baseline-palette-pass.csv
          test -s docs/last-days-baseline-palette-pass.md
          grep -Fq 'Mode: **APPLIED**' docs/last-days-baseline-palette-pass.md

      - name: Commit and safely rebase palette-aligned placeholders
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          # Remove the dated schedule after the pass succeeds. workflow_dispatch and guarded
          # push support remain available without leaving a recurring timer behind.
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/last-days-baseline-palette.yml')
          text = path.read_text(encoding='utf-8')
          marker = "  # One-shot fallback for 2026-08-25 02:15 UTC. The successful job removes this trigger.\n  schedule:\n    - cron: '15 2 25 8 *'\n"
          if marker in text:
              text = text.replace(marker, '')
              path.write_text(text, encoding='utf-8')
          PY

          git add --all -- \
            .github/workflows/last-days-baseline-palette.yml \
            resourcepacks/LAST_DAYS_INFINITE_DOMAIN_1_21_1/assets \
            docs/last-days-baseline-palette-pass.csv \
            docs/last-days-baseline-palette-pass.md

          if git diff --cached --quiet; then
            echo 'No eligible untouched imported textures required palette alignment.'
            exit 0
          fi

          echo "Staged files: $(git diff --cached --name-only | wc -l)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply LAST DAYS baseline palette to compatibility placeholders'

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}: rebasing onto current origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              echo 'Rebase conflict: aborting rather than overwriting concurrent work.'
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done

          echo 'Unable to push after three safe rebase attempts.'
          exit 1
