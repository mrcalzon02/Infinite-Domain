name: Old World Heavy Rebuild Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_old_world_heavy_rebuild_review.py'
      - 'scripts/render_ows001_gate_a_massing.py'
      - 'scripts/render_ows001_gate_b_intact.py'
      - 'scripts/render_ows001_gate_c_damage_states.py'
      - 'scripts/analyze_ows001_gate_c_visuals.py'
      - 'scripts/render_ows001_gate_d_final.py'
      - 'scripts/analyze_ows001_gate_d_visuals.py'
      - 'scripts/render_ows002_gate_a_massing.py'
      - 'scripts/render_ows002_gate_b_intact.py'
      - '.github/workflows/old-world-heavy-rebuild-review.yml'

permissions:
  contents: write

concurrency:
  group: old-world-heavy-rebuild-review-main
  cancel-in-progress: true

jobs:
  review-active-old-world-target:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact review revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile review pipeline
        run: |
          python -m py_compile \
            scripts/generate_wasteland_sites.py \
            scripts/old_world_narrative_core.py \
            scripts/old_world_ows001_final.py \
            scripts/render_structure_review.py \
            scripts/render_old_world_heavy_rebuild_review.py \
            scripts/render_ows001_gate_a_massing.py \
            scripts/render_ows001_gate_b_intact.py \
            scripts/render_ows001_gate_c_damage_states.py \
            scripts/analyze_ows001_gate_c_visuals.py \
            scripts/render_ows001_gate_d_final.py \
            scripts/analyze_ows001_gate_d_visuals.py \
            scripts/render_ows002_gate_a_massing.py \
            scripts/render_ows002_gate_b_intact.py

      - name: Resolve active heavy-rebuild target
        run: |
          ACTIVE_TARGET=$(python -c "import json; print(json.load(open('old_world_narrative/registry/heavy_rebuild_state.json'))['active_target'])")
          echo "ACTIVE_TARGET=$ACTIVE_TARGET" >> "$GITHUB_ENV"
          echo "Active heavy-rebuild target: $ACTIVE_TARGET"

      - name: Render active baseline if needed
        run: python scripts/render_old_world_heavy_rebuild_review.py --target "$ACTIVE_TARGET" --gate baseline

      - name: Render OWS-001 Gate A if ready
        run: python scripts/render_ows001_gate_a_massing.py

      - name: Render OWS-002 Gate A if ready
        run: python scripts/render_ows002_gate_a_massing.py

      - name: Render OWS-001 Gate B if ready
        run: python scripts/render_ows001_gate_b_intact.py

      - name: Render OWS-002 Gate B if ready
        run: python scripts/render_ows002_gate_b_intact.py

      - name: Build compact OWS-002 Gate-B review proxies if available
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('old_world_narrative/reviews/heavy_rebuild/visual/OWS-002/gate_b_intact/r1')
          names = (
              'front_left', 'front_right', 'rear_left', 'rear_right',
              'roof_top_oblique', 'interior_cutaway', 'floor_slices',
          )
          if root.is_dir():
              for name in names:
                  src = root / f'{name}.png'
                  if not src.is_file():
                      continue
                  with Image.open(src) as image:
                      proxy = image.convert('RGB')
                      proxy.thumbnail((240, 240), Image.Resampling.LANCZOS)
                      proxy.save(
                          root / f'{name}_review.jpg',
                          format='JPEG',
                          quality=32,
                          optimize=True,
                          progressive=True,
                      )
          PY

      - name: Render OWS-001 Gate C if ready
        run: python scripts/render_ows001_gate_c_damage_states.py

      - name: Analyze OWS-001 Gate C rendered pixels if ready
        run: python scripts/analyze_ows001_gate_c_visuals.py

      # Automatic Gate-D generation is owned by old-world-static-build.yml so it
      # always runs after the authoritative NBT has been regenerated in the same
      # checkout. These OWS-001 steps remain available for explicit/manual review
      # runs or renderer/analyzer changes, but builder/core edits do not trigger
      # this workflow and therefore cannot race ahead of production serialization.
      - name: Render synchronized OWS-001 Gate D if ready
        run: python scripts/render_ows001_gate_d_final.py

      - name: Analyze OWS-001 Gate D shipping-render regression if ready
        run: python scripts/analyze_ows001_gate_d_visuals.py

      - name: Show review changes
        run: |
          git status --short
          git diff --stat

      - name: Persist review artifacts and gate state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            old_world_narrative/reviews/heavy_rebuild/visual/ \
            old_world_narrative/registry/heavy_rebuild_state.json
          if git diff --cached --quiet; then
            echo 'No heavy-rebuild review changes to persist.'
          else
            git commit -m 'Persist Old World heavy-rebuild visual gate artifacts'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
