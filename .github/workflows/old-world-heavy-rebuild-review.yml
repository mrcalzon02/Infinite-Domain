name: Old World Heavy Rebuild Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/old_world_narrative_core.py'
      - 'scripts/old_world_ows001_final.py'
      - 'scripts/render_old_world_heavy_rebuild_review.py'
      - 'scripts/render_ows001_gate_a_massing.py'
      - 'scripts/render_ows001_gate_b_intact.py'
      - 'scripts/render_ows001_gate_c_damage_states.py'
      - 'scripts/analyze_ows001_gate_c_visuals.py'
      - 'scripts/render_ows001_gate_d_final.py'
      - 'scripts/analyze_ows001_gate_d_visuals.py'
      - '.github/workflows/old-world-heavy-rebuild-review.yml'

permissions:
  contents: write

concurrency:
  group: old-world-heavy-rebuild-review-main
  cancel-in-progress: true

jobs:
  review-active-old-world-target:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact review revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile review pipeline
        run: |
          python -m py_compile \
            scripts/generate_wasteland_sites.py \
            scripts/old_world_narrative_core.py \
            scripts/old_world_ows001_final.py \
            scripts/render_structure_review.py \
            scripts/render_old_world_heavy_rebuild_review.py \
            scripts/render_ows001_gate_a_massing.py \
            scripts/render_ows001_gate_b_intact.py \
            scripts/render_ows001_gate_c_damage_states.py \
            scripts/analyze_ows001_gate_c_visuals.py \
            scripts/render_ows001_gate_d_final.py \
            scripts/analyze_ows001_gate_d_visuals.py

      - name: Render active baseline if needed
        run: python scripts/render_old_world_heavy_rebuild_review.py --target OWS-001 --gate baseline

      - name: Render Gate A if ready
        run: python scripts/render_ows001_gate_a_massing.py

      - name: Render Gate B if ready
        run: python scripts/render_ows001_gate_b_intact.py

      - name: Render Gate C if ready
        run: python scripts/render_ows001_gate_c_damage_states.py

      - name: Analyze Gate C rendered pixels if ready
        run: python scripts/analyze_ows001_gate_c_visuals.py

      - name: Render synchronized Gate D if ready
        run: python scripts/render_ows001_gate_d_final.py

      - name: Analyze Gate D shipping-render regression if ready
        run: python scripts/analyze_ows001_gate_d_visuals.py

      - name: Show review changes
        run: |
          git status --short
          git diff --stat

      - name: Persist review artifacts and gate state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            old_world_narrative/reviews/heavy_rebuild/visual/ \
            old_world_narrative/registry/heavy_rebuild_state.json
          if git diff --cached --quiet; then
            echo 'No heavy-rebuild review changes to persist.'
          else
            git commit -m 'Persist Old World heavy-rebuild visual gate artifacts'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
