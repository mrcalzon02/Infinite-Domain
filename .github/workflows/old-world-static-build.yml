name: Old World Static Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_wasteland_sites.py'
      - 'scripts/generate_old_world_narrative_structures.py'
      - 'scripts/old_world_narrative_core.py'
      - 'scripts/old_world_ows*_final.py'
      - 'scripts/old_world_later_waves.py'
      - 'scripts/old_world_institution_waves.py'
      - 'scripts/old_world_crisis_waves.py'
      - 'scripts/old_world_final_waves.py'
      - 'scripts/build_old_world_narrative.py'
      - 'scripts/old_world_narrative_package_core.py'
      - 'scripts/render_structure_review.py'
      - 'scripts/render_old_world_heavy_rebuild_review.py'
      - 'scripts/render_ows*_gate_*.py'
      - 'scripts/analyze_ows*_gate_*.py'
      - 'scripts/validate_old_world_narrative.py'
      - 'docs/HEAVY_REBUILD_DOCTRINE.md'
      - 'docs/old-world/**'
      - 'old_world_narrative/registry/heavy_rebuild_state.json'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-*_RESTART_DOSSIER.md'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-*_PASS*.md'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-*_GATE_*.md'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-*_FINAL_REBUILD_REPORT.md'
      - '.github/workflows/old-world-static-build.yml'

permissions:
  contents: write

concurrency:
  group: old-world-static-build-main
  cancel-in-progress: true

jobs:
  build-old-world:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install static render dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile Old World Python entrypoints
        run: |
          set -o pipefail
          {
            echo '=== Compile Old World Python entrypoints ==='
            python -m py_compile \
              scripts/generate_wasteland_sites.py \
              scripts/generate_old_world_narrative_structures.py \
              scripts/old_world_narrative_core.py \
              scripts/old_world_ows*_final.py \
              scripts/old_world_later_waves.py \
              scripts/old_world_institution_waves.py \
              scripts/old_world_crisis_waves.py \
              scripts/old_world_final_waves.py \
              scripts/build_old_world_narrative.py \
              scripts/old_world_narrative_package_core.py \
              scripts/render_structure_review.py \
              scripts/render_old_world_heavy_rebuild_review.py \
              scripts/render_ows*_gate_*.py \
              scripts/analyze_ows*_gate_*.py \
              scripts/validate_old_world_narrative.py \
              scripts/audit_old_world_registry_conflicts.py
          } 2>&1 | tee -a old-world-static-build.log

      - name: Resolve active heavy-rebuild target
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('old_world_narrative/registry/heavy_rebuild_state.json').read_text())
          target = state['active_target']
          Path('active-old-world-target.txt').write_text(target + '\n')
          with open('${GITHUB_ENV}', 'a') as handle:
              handle.write(f'ACTIVE_OLD_WORLD_TARGET={target}\n')
          print(f'Active heavy-rebuild target: {target}')
          PY

      - name: Render active heavy-rebuild Phase-0 baseline
        run: |
          set -o pipefail
          {
            echo "=== Render ${ACTIVE_OLD_WORLD_TARGET} Phase-0 baseline ==="
            python scripts/render_old_world_heavy_rebuild_review.py --target "${ACTIVE_OLD_WORLD_TARGET}" --gate baseline
          } 2>&1 | tee -a old-world-static-build.log

      - name: Render legacy OWS-001 Gate-A massing when applicable
        run: |
          set -o pipefail
          { python scripts/render_ows001_gate_a_massing.py; } 2>&1 | tee -a old-world-static-build.log

      - name: Rebuild package registries safely
        run: |
          set -o pipefail
          { echo '=== Rebuild package registries safely ==='; python scripts/build_old_world_narrative.py; } 2>&1 | tee -a old-world-static-build.log

      - name: Generate authoritative Old World structures
        run: |
          set -o pipefail
          { echo '=== Generate authoritative Old World structures ==='; python scripts/generate_old_world_narrative_structures.py; } 2>&1 | tee -a old-world-static-build.log

      - name: Render synchronized OWS-001 Gate-D final review when applicable
        run: |
          set -o pipefail
          { python scripts/render_ows001_gate_d_final.py; } 2>&1 | tee -a old-world-static-build.log

      - name: Analyze synchronized OWS-001 Gate-D shipping render when applicable
        run: |
          set -o pipefail
          { python scripts/analyze_ows001_gate_d_visuals.py; } 2>&1 | tee -a old-world-static-build.log

      - name: Render ordinary static review views
        run: |
          set -o pipefail
          { echo '=== Render ordinary static review views ==='; python scripts/render_structure_review.py --old-world; } 2>&1 | tee -a old-world-static-build.log

      - name: Synchronize render-aware implementation state
        run: |
          set -o pipefail
          { echo '=== Synchronize render-aware implementation state ==='; python -c "import sys; sys.path.insert(0, 'scripts'); import generate_old_world_narrative_structures as old_world; old_world.sync_registry()"; } 2>&1 | tee -a old-world-static-build.log

      - name: Validate Old World static contracts
        run: |
          set -o pipefail
          {
            echo '=== Validate Old World static contracts ==='
            python scripts/validate_old_world_narrative.py
            python scripts/audit_old_world_registry_conflicts.py
          } 2>&1 | tee -a old-world-static-build.log

      - name: Clear stale failure diagnostic after successful validation
        run: rm -f old_world_narrative/reviews/static-build-failure.log

      - name: Record generated change set
        run: |
          git status --short
          git diff --stat
          git diff --name-only > old-world-generated-files.txt

      - name: Commit validated Old World source/generated/review outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- \
            scripts/generate_wasteland_sites.py \
            scripts/old_world_narrative_core.py \
            scripts/validate_old_world_narrative.py \
            kubejs/data/infinite_domain/structure/wasteland/old_world/ \
            kubejs/data/infinite_domain/worldgen/structure/old_world/ \
            kubejs/data/infinite_domain/worldgen/structure_set/old_world/ \
            kubejs/data/infinite_domain/worldgen/template_pool/old_world/ \
            kubejs/data/infinite_domain/loot_table/chests/old_world/ \
            old_world_narrative/structures/ \
            old_world_narrative/reviews/ \
            old_world_narrative/registry/ \
            old_world_narrative/quests/ \
            config/ftbquests/quests/chapters/old_world_investigation.snbt \
            config/ftbquests/quests/lang/en_us.snbt

          if git diff --cached --quiet; then
            echo 'No validated Old World generated/review changes to commit.'
          else
            git commit -m 'Persist Old World heavy-rebuild review artifacts'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload generated Old World artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: old-world-static-build
          if-no-files-found: warn
          retention-days: 7
          path: |
            active-old-world-target.txt
            old-world-generated-files.txt
            kubejs/data/infinite_domain/structure/wasteland/old_world/
            kubejs/data/infinite_domain/worldgen/structure/old_world/
            kubejs/data/infinite_domain/worldgen/structure_set/old_world/
            kubejs/data/infinite_domain/worldgen/template_pool/old_world/
            kubejs/data/infinite_domain/loot_table/chests/old_world/
            old_world_narrative/structures/
            old_world_narrative/reviews/
            old_world_narrative/registry/
            old_world_narrative/quests/
            config/ftbquests/quests/chapters/old_world_investigation.snbt
            config/ftbquests/quests/lang/en_us.snbt

      - name: Persist first static-build failure for repair
        if: failure()
        run: |
          mkdir -p old_world_narrative/reviews
          {
            echo '[SYSTEM REPORT] Old World static build failure diagnostic'
            echo "source_sha=${GITHUB_SHA}"
            echo "active_target=${ACTIVE_OLD_WORLD_TARGET:-unresolved}"
            echo
            cat old-world-static-build.log 2>/dev/null || echo 'No project-stage log was produced; failure occurred before Python compilation.'
          } > old_world_narrative/reviews/static-build-failure.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- old_world_narrative/reviews/static-build-failure.log
          if ! git diff --cached --quiet; then
            git commit -m 'Record Old World static build failure'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
