name: OWS-003 Gate-B Intact Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/old-world-ows003-gate-b.yml'
      - 'scripts/render_ows003_gate_b_intact.py'
      - 'scripts/render_ows003_gate_b_intact_r2.py'
      - 'scripts/render_ows003_gate_b_intact_r3.py'

permissions:
  contents: write

concurrency:
  group: old-world-static-build-main
  cancel-in-progress: true

jobs:
  render-gate-b:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact intact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile Gate-B review model
        run: |
          python -m py_compile \
            scripts/generate_wasteland_sites.py \
            scripts/render_structure_review.py \
            scripts/render_old_world_heavy_rebuild_review.py \
            scripts/render_ows003_gate_a_massing.py \
            scripts/render_ows003_gate_b_intact.py \
            scripts/render_ows003_gate_b_intact_r2.py \
            scripts/render_ows003_gate_b_intact_r3.py

      - name: Render OWS-003 Gate-B r3
        id: render_gate_b
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/render_ows003_gate_b_intact_r3.py 2>&1 | tee /tmp/ows003-gate-b.log

      - name: Persist Gate-B failure diagnostic
        if: steps.render_gate_b.outcome == 'failure'
        run: |
          cp /tmp/ows003-gate-b.log old_world_narrative/reviews/heavy_rebuild/OWS-003_GATE_B_FAILURE.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- old_world_narrative/reviews/heavy_rebuild/OWS-003_GATE_B_FAILURE.log
          if ! git diff --cached --quiet; then
            git commit -m 'Record OWS-003 Gate-B renderer failure'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Record Gate-B workflow provenance
        if: steps.render_gate_b.outcome == 'success'
        run: |
          mkdir -p old_world_narrative/reviews/heavy_rebuild/visual/OWS-003
          cat > old_world_narrative/reviews/heavy_rebuild/visual/OWS-003/gate_b_workflow_run.json <<EOF
          {
            "workflow": "OWS-003 Gate-B Intact Review",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "active_target": "OWS-003",
            "revision": "r3"
          }
          EOF

      - name: Upload Gate-B review artifact
        if: steps.render_gate_b.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: old-world-heavy-rebuild-OWS-003-gate-b-r3
          retention-days: 7
          path: |
            old_world_narrative/reviews/heavy_rebuild/visual/OWS-003/
            old_world_narrative/registry/heavy_rebuild_state.json

      - name: Persist Gate-B artifacts and pending-review state
        if: steps.render_gate_b.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            old_world_narrative/reviews/heavy_rebuild/visual/OWS-003/ \
            old_world_narrative/registry/heavy_rebuild_state.json \
            old_world_narrative/reviews/heavy_rebuild/OWS-003_GATE_B_FAILURE.log
          if git diff --cached --quiet; then
            echo 'No Gate-B changes to persist.'
          else
            git commit -m 'Persist OWS-003 Gate-B intact review artifacts'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Fail job after diagnostic persistence
        if: steps.render_gate_b.outcome == 'failure'
        run: exit 1
