name: OWS-003 Gate-B Intact Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/old-world-ows003-gate-b.yml'
      - 'scripts/render_ows003_gate_b_intact*.py'
      - 'scripts/record_ows003_gate_b_r7.py'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-003_GATE_B_R7_REVIEW.md'

permissions:
  contents: write

concurrency:
  group: old-world-static-build-main
  cancel-in-progress: true

jobs:
  render-gate-b:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact intact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Resolve latest Gate-B revision
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          candidates = []
          for path in Path('scripts').glob('render_ows003_gate_b_intact_r*.py'):
              match = re.search(r'_r(\d+)\.py$', path.name)
              if match:
                  candidates.append((int(match.group(1)), path))
          if not candidates:
              raise SystemExit('No revisioned OWS-003 Gate-B renderer exists')
          revision, path = max(candidates)
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'GATE_B_REVISION=r{revision}\n')
              handle.write(f'GATE_B_SCRIPT={path.as_posix()}\n')
          print(f'Using {path} as Gate-B r{revision}')
          PY

      - name: Compile Gate-B review model
        run: |
          python -m py_compile \
            scripts/generate_wasteland_sites.py \
            scripts/render_structure_review.py \
            scripts/render_old_world_heavy_rebuild_review.py \
            scripts/render_ows003_gate_a_massing.py \
            scripts/render_ows003_gate_b_intact*.py \
            scripts/record_ows003_gate_b_r7.py

      - name: Render latest OWS-003 Gate-B revision when still renderable
        id: render_gate_b
        continue-on-error: true
        run: |
          set -o pipefail
          python "${GATE_B_SCRIPT}" 2>&1 | tee /tmp/ows003-gate-b.log

      - name: Persist Gate-B failure diagnostic
        if: steps.render_gate_b.outcome == 'failure'
        run: |
          cp /tmp/ows003-gate-b.log old_world_narrative/reviews/heavy_rebuild/OWS-003_GATE_B_FAILURE.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- old_world_narrative/reviews/heavy_rebuild/OWS-003_GATE_B_FAILURE.log
          if ! git diff --cached --quiet; then
            git commit -m 'Record OWS-003 Gate-B renderer failure'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Record explicit reviewed Gate-B decision
        if: steps.render_gate_b.outcome == 'success'
        run: python scripts/record_ows003_gate_b_r7.py

      - name: Record Gate-B workflow provenance
        if: steps.render_gate_b.outcome == 'success'
        run: |
          mkdir -p old_world_narrative/reviews/heavy_rebuild/visual/OWS-003
          cat > old_world_narrative/reviews/heavy_rebuild/visual/OWS-003/gate_b_workflow_run.json <<EOF
          {
            "workflow": "OWS-003 Gate-B Intact Review",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "active_target": "OWS-003",
            "revision": "${GATE_B_REVISION}",
            "renderer": "${GATE_B_SCRIPT}"
          }
          EOF

      - name: Upload Gate-B review artifact
        if: steps.render_gate_b.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: old-world-heavy-rebuild-OWS-003-gate-b
          retention-days: 7
          path: |
            old_world_narrative/reviews/heavy_rebuild/visual/OWS-003/
            old_world_narrative/registry/heavy_rebuild_state.json

      - name: Persist Gate-B artifacts and reviewed state
        if: steps.render_gate_b.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            old_world_narrative/reviews/heavy_rebuild/visual/OWS-003/ \
            old_world_narrative/registry/heavy_rebuild_state.json \
            old_world_narrative/reviews/heavy_rebuild/OWS-003_GATE_B_FAILURE.log
          if git diff --cached --quiet; then
            echo 'No Gate-B changes to persist.'
          else
            git commit -m 'Record OWS-003 Gate-B r7 approval state'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Fail job after diagnostic persistence
        if: steps.render_gate_b.outcome == 'failure'
        run: exit 1
