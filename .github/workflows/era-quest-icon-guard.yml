name: Era Quest Icon Guard

on:
  push:
    branches: [main]
    paths:
      - 'config/ftbquests/quests/chapters/era_*.snbt'
      - 'scripts/ensure_ftbquest_icons.js'
      - '.github/workflows/era-quest-icon-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: era-quest-icon-guard-main
  cancel-in-progress: false

jobs:
  normalize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize Era 1-8 icons
        run: node scripts/ensure_ftbquest_icons.js

      - name: Verify deterministic icon contract
        run: node scripts/ensure_ftbquest_icons.js --check

      - name: Commit normalized quest files
        shell: bash
        run: |
          if git diff --quiet -- config/ftbquests/quests/chapters/era_*.snbt; then
            echo 'Era quest icons already normalized.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/ftbquests/quests/chapters/era_*.snbt
          git commit -m 'Normalize deterministic Era quest icons'
          git pull --rebase origin main
          git push origin HEAD:main
