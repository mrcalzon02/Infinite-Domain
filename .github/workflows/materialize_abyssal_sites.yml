name: Materialize Abyssal Sites

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/materialize_abyssal_sites.yml'
      - 'tools/abyssal_rebuild/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-abyssal-sites-main
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate abyssal structures
        run: |
          python tools/abyssal_rebuild/generate_abyssal_sites.py kubejs/data/infinite_domain/structure/abyssal

      - name: Verify deterministic blob hashes
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [pelagos_abyssal_relay.nbt]=3c2131b132b8765c2ee1bb66174d28d7d94ae54a
            [pelagos_fracture_observatory.nbt]=b26ffb308ed79027411ab4893fccc8b33f6c38b4
            [pelagos_hadal_probe_station.nbt]=c7c28af60c67d2b9033d9860d711614cf5338f64
            [karsic_abyssal_pipeline_station.nbt]=3d8b155d3552cd9084f691a92a0b19e01ba07e5d
            [karsic_fracture_listening_post.nbt]=b322e203a86be4ff7963eae31c6978cfb85e19fe
            [karsic_hadal_blacksite.nbt]=84b2de43cd4298db62ed0a49958d0fb41c53c1bd
          )
          dir='kubejs/data/infinite_domain/structure/abyssal'
          for name in "${!expected[@]}"; do
            actual="$(git hash-object "$dir/$name")"
            if [[ "$actual" != "${expected[$name]}" ]]; then
              echo "Hash mismatch for $name: expected ${expected[$name]}, got $actual" >&2
              exit 1
            fi
          done

      - name: Reject unrelated generated changes
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(kubejs/data/infinite_domain/structure/abyssal/(pelagos_abyssal_relay|pelagos_fracture_observatory|pelagos_hadal_probe_station|karsic_abyssal_pipeline_station|karsic_fracture_listening_post|karsic_hadal_blacksite)\.nbt)$'
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ ! "$path" =~ $allowed ]]; then
              echo "Unexpected generated change: $path" >&2
              exit 1
            fi
          done < <(git status --porcelain=v1 | sed -E 's/^.. //')

      - name: Commit materialized NBTs
        shell: bash
        run: |
          set -euo pipefail
          git add \
            kubejs/data/infinite_domain/structure/abyssal/pelagos_abyssal_relay.nbt \
            kubejs/data/infinite_domain/structure/abyssal/pelagos_fracture_observatory.nbt \
            kubejs/data/infinite_domain/structure/abyssal/pelagos_hadal_probe_station.nbt \
            kubejs/data/infinite_domain/structure/abyssal/karsic_abyssal_pipeline_station.nbt \
            kubejs/data/infinite_domain/structure/abyssal/karsic_fracture_listening_post.nbt \
            kubejs/data/infinite_domain/structure/abyssal/karsic_hadal_blacksite.nbt
          if git diff --cached --quiet; then
            echo 'Abyssal NBTs already match the deterministic generator.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize rebuilt abyssal site NBTs'
          git push origin HEAD:main
