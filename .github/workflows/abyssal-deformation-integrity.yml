name: Abyssal Deformation Integrity

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/abyssal-deformation-integrity.yml'
      - 'tools/abyssal_worldgen/**'
      - 'datapacks/gradient_ocean_pack/data/custom_worldgen/worldgen/**'
      - 'datapacks/gradient_ocean_pack/data/minecraft/worldgen/density_function/overworld/continents.json'
      - 'kubejs/data/wastelands/worldgen/noise_settings/wasteland.json'
      - 'kubejs/data/infinite_domain/worldgen/biome/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify abyssal deformation graph
        run: python tools/abyssal_worldgen/validate_abyssal_deformation.py
