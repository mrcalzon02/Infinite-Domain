name: OWS-004 Gate-C Review Decision

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/old-world-ows004-gate-c-decision.yml'
      - 'scripts/record_ows004_gate_c_r4_review.py'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-004_GATE_C_R4_REVIEW.md'
      - 'old_world_narrative/reviews/heavy_rebuild/visual/OWS-004/gate_c_damage_states/r4/**'

permissions:
  contents: write

concurrency:
  group: old-world-static-build-main
  cancel-in-progress: true

jobs:
  record-gate-c-r4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile guarded review recorder
        run: python -m py_compile scripts/record_ows004_gate_c_r4_review.py

      - name: Record explicit Gate-C r4 decision
        run: python scripts/record_ows004_gate_c_r4_review.py

      - name: Persist Gate-C passed state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- old_world_narrative/registry/heavy_rebuild_state.json
          if git diff --cached --quiet; then
            echo 'No Gate-C decision state change to persist.'
          else
            git commit -m 'Record OWS-004 Gate-C r4 passed state'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
