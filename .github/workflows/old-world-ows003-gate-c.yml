name: OWS-003 Gate-C Damage-State Review

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - '.github/workflows/old-world-ows003-gate-c.yml'
      - 'scripts/render_ows003_gate_c_damage_states*.py'
      - 'scripts/render_ows003_gate_c_damage_states_r3.py'
      - 'scripts/render_ows003_gate_b_intact*.py'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-003_PASS13_HISTORICAL_LAYERING.md'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-003_PASS14_ENVIRONMENTAL_NARRATIVE.md'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-003_PASS15_ENCOUNTER_ARCHITECTURE.md'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-003_PASS16_LOOT_ARCHITECTURE.md'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-003_PASS17_QUEST_PROOF_ARCHITECTURE.md'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-003_PASS18_DAMAGE_AND_DECAY.md'
      - 'old_world_narrative/reviews/heavy_rebuild/OWS-003_GATE_B_R7_REVIEW.md'

permissions:
  contents: write

concurrency:
  group: old-world-ows003-gate-c-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  render-gate-c:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip gate-c]')) ||
      (github.event_name == 'issues' && github.event.issue.title == '[CI] OWS-003 Gate-C r3 fixed-camera trigger')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Gate-C revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether r3 capture is still needed
        id: capture
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path('old_world_narrative/registry/heavy_rebuild_state.json').read_text())
          manifest = Path('old_world_narrative/reviews/heavy_rebuild/visual/OWS-003/gate_c_damage_states/r3/gate_c_manifest.json')
          gate_status = state.get('visual_review_gates', {}).get('gate_c_damage_states', {}).get('status', '')
          needed = (
              state.get('active_target') == 'OWS-003'
              and not manifest.is_file()
              and gate_status != 'passed_r3'
              and state.get('active_status') != 'gate_c_r3_passed_ready_for_micro_detail'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f"needed={'true' if needed else 'false'}\n")
          print(f'OWS-003 Gate-C r3 capture needed={needed}; status={gate_status}; manifest={manifest.is_file()}')
          PY

      - name: Set up Python
        if: steps.capture.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependency
        if: steps.capture.outputs.needed == 'true'
        run: python -m pip install --disable-pip-version-check pillow

      - name: Resolve latest Gate-C revision
        if: steps.capture.outputs.needed == 'true'
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          base = Path('scripts/render_ows003_gate_c_damage_states.py')
          candidates = [(1, base)] if base.exists() else []
          for path in Path('scripts').glob('render_ows003_gate_c_damage_states_r*.py'):
              match = re.search(r'_r(\d+)\.py$', path.name)
              if match:
                  candidates.append((int(match.group(1)), path))
          if not candidates:
              raise SystemExit('No OWS-003 Gate-C renderer exists')
          revision, path = max(candidates)
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'GATE_C_REVISION=r{revision}\n')
              handle.write(f'GATE_C_SCRIPT={path.as_posix()}\n')
          print(f'Using {path} as Gate-C r{revision}')
          PY

      - name: Compile Gate-C review model
        if: steps.capture.outputs.needed == 'true'
        run: |
          python -m py_compile \
            scripts/generate_wasteland_sites.py \
            scripts/render_structure_review.py \
            scripts/render_old_world_heavy_rebuild_review.py \
            scripts/render_ows003_gate_a_massing.py \
            scripts/render_ows003_gate_b_intact*.py \
            scripts/render_ows003_gate_c_damage_states*.py \
            scripts/analyze_ows003_gate_c_visuals.py

      - name: Render latest OWS-003 Gate-C revision
        if: steps.capture.outputs.needed == 'true'
        id: render_gate_c
        continue-on-error: true
        run: |
          set -o pipefail
          python "${GATE_C_SCRIPT}" 2>&1 | tee /tmp/ows003-gate-c.log

      - name: Analyze Gate-C r3 pixels without approval semantics
        if: steps.capture.outputs.needed == 'true' && steps.render_gate_c.outcome == 'success' && env.GATE_C_REVISION == 'r3'
        run: python scripts/analyze_ows003_gate_c_visuals.py

      - name: Persist Gate-C failure diagnostic
        if: steps.capture.outputs.needed == 'true' && steps.render_gate_c.outcome == 'failure'
        run: |
          cp /tmp/ows003-gate-c.log old_world_narrative/reviews/heavy_rebuild/OWS-003_GATE_C_FAILURE.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- old_world_narrative/reviews/heavy_rebuild/OWS-003_GATE_C_FAILURE.log
          if ! git diff --cached --quiet; then
            git commit -m 'Record OWS-003 Gate-C renderer failure'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Record Gate-C workflow provenance
        if: steps.capture.outputs.needed == 'true' && steps.render_gate_c.outcome == 'success'
        run: |
          mkdir -p old_world_narrative/reviews/heavy_rebuild/visual/OWS-003
          cat > old_world_narrative/reviews/heavy_rebuild/visual/OWS-003/gate_c_workflow_run.json <<EOF
          {
            "workflow": "OWS-003 Gate-C Damage-State Review",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "active_target": "OWS-003",
            "revision": "${GATE_C_REVISION}",
            "renderer": "${GATE_C_SCRIPT}",
            "event_name": "${GITHUB_EVENT_NAME}"
          }
          EOF

      - name: Upload Gate-C review artifact
        if: steps.capture.outputs.needed == 'true' && steps.render_gate_c.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: old-world-heavy-rebuild-OWS-003-gate-c
          retention-days: 7
          path: |
            old_world_narrative/reviews/heavy_rebuild/visual/OWS-003/
            old_world_narrative/registry/heavy_rebuild_state.json

      - name: Persist Gate-C artifacts and pending-review state
        if: steps.capture.outputs.needed == 'true' && steps.render_gate_c.outcome == 'success'
        run: |
          rm -f old_world_narrative/reviews/heavy_rebuild/OWS-003_GATE_C_FAILURE.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            old_world_narrative/reviews/heavy_rebuild/visual/OWS-003/ \
            old_world_narrative/registry/heavy_rebuild_state.json \
            old_world_narrative/reviews/heavy_rebuild/OWS-003_GATE_C_FAILURE.log
          if git diff --cached --quiet; then
            echo 'No Gate-C changes to persist.'
          else
            git commit -m 'Persist OWS-003 Gate-C damage-state review artifacts'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Fail job after diagnostic persistence
        if: steps.capture.outputs.needed == 'true' && steps.render_gate_c.outcome == 'failure'
        run: exit 1

# Temporary schedule + issue event paths exist only to capture the blocked r3 review.
# Event-specific concurrency prevents cleanup pushes from cancelling an in-flight issue/schedule run.
# Capture self-disables once the exact r3 manifest exists or Gate C has passed.
