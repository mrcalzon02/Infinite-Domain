# Advance only after the current active target is already guarded-complete.
name: Old World Heavy Rebuild Advance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/advance_old_world_heavy_rebuild_target.py'
      - '.github/workflows/old-world-heavy-rebuild-advance.yml'

permissions:
  contents: write

concurrency:
  group: old-world-static-build-main
  cancel-in-progress: true

jobs:
  advance-and-render-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact activation revision with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile transition and baseline renderer
        run: |
          python -m py_compile \
            scripts/generate_wasteland_sites.py \
            scripts/_old_world_narrative_structure_core.py \
            scripts/old_world_narrative_core.py \
            scripts/advance_old_world_heavy_rebuild_target.py \
            scripts/render_structure_review.py \
            scripts/render_old_world_heavy_rebuild_review.py

      - name: Advance completed target to next queue entry
        run: python scripts/advance_old_world_heavy_rebuild_target.py

      - name: Resolve newly active target
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path('old_world_narrative/registry/heavy_rebuild_state.json').read_text())
          target = state['active_target']
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'ACTIVE_OLD_WORLD_TARGET={target}\n')
          print(f'Active heavy-rebuild target after advancement: {target}')
          PY

      - name: Render exact Phase-0 historical baseline
        run: python scripts/render_old_world_heavy_rebuild_review.py --target "$ACTIVE_OLD_WORLD_TARGET" --gate baseline

      - name: Record transition workflow provenance
        run: |
          mkdir -p "old_world_narrative/reviews/heavy_rebuild/visual/$ACTIVE_OLD_WORLD_TARGET"
          cat > "old_world_narrative/reviews/heavy_rebuild/visual/$ACTIVE_OLD_WORLD_TARGET/advance_workflow_run.json" <<EOF
          {
            "workflow": "Old World Heavy Rebuild Advance",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "active_target": "${ACTIVE_OLD_WORLD_TARGET}"
          }
          EOF

      - name: Upload Phase-0 baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: old-world-heavy-rebuild-${{ env.ACTIVE_OLD_WORLD_TARGET }}-phase0
          retention-days: 7
          path: |
            old_world_narrative/reviews/heavy_rebuild/visual/${{ env.ACTIVE_OLD_WORLD_TARGET }}/
            old_world_narrative/registry/heavy_rebuild_state.json

      - name: Persist target activation and baseline artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            old_world_narrative/registry/heavy_rebuild_state.json \
            old_world_narrative/reviews/heavy_rebuild/visual/
          if git diff --cached --quiet; then
            echo 'No target-transition changes to persist.'
          else
            git commit -m 'Persist active Old World Phase-0 baseline review'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
