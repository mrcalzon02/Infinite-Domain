#Heads-up display
[hud]
	#Maximum active-buff rows shown in the buff list (left edge of the screen).
	#Lower this on small GUI scales to keep the list compact; raise it on large
	#GUI scales to fill the extra space. A row showing a detail line under it
	#("12 damage prevented") counts as one and a half rows of this budget.
	# Default: 10
	# Range: 3 ~ 15
	maxBuffRows = 10
