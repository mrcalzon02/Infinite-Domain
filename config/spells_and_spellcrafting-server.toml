#Wand-borne minion enchantments (Attuned Grimoire). One enable knob per enchant:
#each toggles that enchant's per-minion-type effects across the whole army. A
#disabled enchant can still be applied to a wand; it simply does nothing until
#re-enabled.
[wand_enchants]
	#Gravity: zombie melee yanks the target in, skeleton bolts shove it back,
	#spiders root, the enderman tank drags taunted mobs onto itself, and wither
	#skeletons stun. true = active.
	gravity = true
	#Ferocity (damage): zombie bonus melee + execute, skeleton bolt damage,
	#spider venom, enderman damage reflect, wither wither-touch + on-hit. true = active.
	ferocity = true
	#Ravening (sustain): per-type lifesteal — the army heals a small fraction of
	#the damage it deals/soaks. Tuned well below incoming DPS. true = active.
	ravening = true
	#Contagion (debuff spread): zombie Weakness+Hunger, skeleton brittle-mark
	#(marked targets take more from the whole army), spider Nausea, enderman
	#Weakness on taunt, wither Wither splash. true = active.
	contagion = true
	#Warding (defense): zombie Undying (survives a lethal hit on a cooldown),
	#spider evasion, enderman/owner Resistance aura, wither armor + reflect. true = active.
	warding = true
	#Whether wand-enchant crowd control (root/stun/yank/drag/shove) may affect
	#NON-owner players. false (default) = minions never CC other players, so an
	#army can't perma-lock a player in PvP; true = players are fair game.
	affectPlayers = false
	#Chance that a wand found in a chest comes pre-enchanted with a wand enchant.
	#High by default because found wands are already rare. 0 disables pre-enchanting.
	# Default: 0.75
	# Range: 0.0 ~ 1.0
	foundWandEnchantChance = 0.75
	#Per-eligible-chest chance to also find a wand-enchant book, like any other
	#enchanted book in loot. 0 disables enchant books in chests.
	# Default: 0.04
	# Range: 0.0 ~ 1.0
	bookInChestChance = 0.04

	#Per-effect balance magnitudes for the wand enchants. Values scale per enchant level
	#where a key ends in PerLevel (final = base + perLevel x level); durations are in
	#seconds, ranges in blocks. Tune freely; 0 neutralises that lever.
	[wand_enchants.tuning]
		# Default: 0.5
		# Range: 0.0 ~ 5.0
		gravityPullStrengthBase = 0.5
		# Default: 0.2
		# Range: 0.0 ~ 5.0
		gravityPullStrengthPerLevel = 0.2
		# Default: 0.6
		# Range: 0.0 ~ 5.0
		gravityPushStrengthBase = 0.6
		# Default: 0.25
		# Range: 0.0 ~ 5.0
		gravityPushStrengthPerLevel = 0.25
		# Default: 1.0
		# Range: 0.0 ~ 30.0
		gravityWebSecondsBase = 1.0
		# Default: 0.5
		# Range: 0.0 ~ 30.0
		gravityWebSecondsPerLevel = 0.5
		# Default: 0.1
		# Range: 0.0 ~ 1.0
		gravityWitherStunChanceBase = 0.1
		# Default: 0.1
		# Range: 0.0 ~ 1.0
		gravityWitherStunChancePerLevel = 0.1
		# Default: 1.5
		# Range: 0.0 ~ 30.0
		gravityWitherStunSeconds = 1.5
		# Default: 16.0
		# Range: 1.0 ~ 64.0
		gravityPullRange = 16.0
		# Default: 10.0
		# Range: 1.0 ~ 64.0
		gravityWebRange = 10.0
		# Default: 6.0
		# Range: 1.0 ~ 64.0
		gravityPushRange = 6.0
		# Default: 0.75
		# Range: 0.0 ~ 50.0
		ferocityBonusDamagePerLevel = 0.75
		# Default: 0.35
		# Range: 0.0 ~ 1.0
		ferocityExecuteThreshold = 0.35
		# Default: 2.0
		# Range: 1.0 ~ 10.0
		ferocityExecuteMultiplier = 2.0
		# Default: 1.0
		# Range: 0.0 ~ 5.0
		ferocitySpiderPoisonAmpPerLevel = 1.0
		# Default: 1.0
		# Range: 0.0 ~ 5.0
		ferocityWitherAmpPerLevel = 1.0
		# Default: 0.1
		# Range: 0.0 ~ 5.0
		ferocityBoltDamagePercentPerLevel = 0.1
		# Default: 0.05
		# Range: 0.0 ~ 1.0
		ferocityBoltHomingPerLevel = 0.05
		# Default: 2.0
		# Range: 0.0 ~ 50.0
		ferocityReflectPerLevel = 2.0
		# Default: 0.5
		# Range: 0.0 ~ 50.0
		raveningLeechPerLevel = 0.5
		# Default: 0.05
		# Range: 0.0 ~ 1.0
		raveningSoakFractionPerLevel = 0.05
		# Default: 1.0
		# Range: 0.0 ~ 50.0
